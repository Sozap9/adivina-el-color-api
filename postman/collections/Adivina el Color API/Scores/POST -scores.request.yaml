$kind: http-request
name: POST /scores
url: "{{baseUrl}}/scores"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: '{ "player": "Diego", "points": 120, "hits": 8 }'
scripts:
  - type: afterResponse
    code: pm.test("201 Created", () => pm.response.to.have.status(201));
    language: text/javascript
order: 1000
